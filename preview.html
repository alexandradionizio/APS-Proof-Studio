<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>APS Proof Studio • Preview</title>
  <link rel="stylesheet" href="assets/css/ui.css?v=0.19.4">
  <link rel="stylesheet" href="assets/css/pdf.css?v=0.19.4">
  <link rel="stylesheet" href="assets/css/models.css?v=0.19.4">
  <link rel="stylesheet" href="assets/css/preview.css?v=0.19.4">
</head>
<body>
  <div class="preview-window-shell">
    <header class="preview-window-topbar">
      <div class="preview-window-brand">
        <div class="preview-window-mark">APS</div>
        <div>
          <div class="preview-window-title">Preview da prova</div>
          <div class="preview-window-sub">Atualização automática a partir do painel</div>
        </div>
      </div>
      <div class="preview-window-actions">
        <span class="preview-window-status" id="previewSyncStatus">Carregando projeto…</span>
        <button class="preview-window-btn" id="refreshPreviewBtn">Atualizar</button>
        <button class="preview-window-btn primary" id="printPreviewBtn">Gerar PDF</button>
      </div>
    </header>
    <main class="preview-window-body">
      <p class="preview-window-note">Esta janela mostra somente a prova do cliente. As configurações internas ficam no painel principal.</p>
      <div id="preview"></div>
      <span id="pageCountLabel" hidden></span>
    </main>
  </div>

  <script src="assets/js/state.js?v=0.19.4"></script>
  <script src="assets/js/editor.js?v=0.19.4"></script>
  <script src="assets/js/pdf.js?v=0.19.4"></script>
  <script src="assets/js/fonts.js?v=0.19.4"></script>
  <script src="assets/js/preview.js?v=0.19.4"></script>
</body>
</html>
